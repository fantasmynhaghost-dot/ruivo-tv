function getJSON(u) {

    const x = new XMLHttpRequest(); x.open('GET', u + (location.protocol === 'file:' ? '' : '?t=' + Date.now()));

}

function parseEp(name) {
  let m = name.match(/^(.*?)[\s._\-–:|]*\bS(\d{1,2})\s*[ ._-]?E(\d{1,3})\b[\s._\-–:|]*(.*)$/i);
  if (!m) m = name.match(/^(.*?)[\s._\-–:|]*\b(\d{1,2})x(\d{1,3})\b[\s._\-–:|]*(.*)$/i);
  if (!m || !m[1].trim()) return null;
  return { series: m[1].trim(), season: +m[2], ep: +m[3], title: m[4].trim() };
}
/* linha compacta: [nome, url, logo, categoria, número, tipo, duração, série, temporada, episódio] */
function parseM3U(text) {
  const raw = []; let meta = null;
  for (const ln of String(text).split(/\r?\n/)) {
    const l = ln.trim(); if (!l) continue;
    if (l.startsWith('#EXTINF')) {
      const a = k => { const m = l.match(new RegExp(k + '="([^"]*)"', 'i')); return m ? m[1] : ''; };
      let q = false, ci = -1;
      for (let i = 7; i < l.length; i++) { const c = l[i]; if (c === '"') q = !q; else if (c === ',' && !q) { ci = i; break; } }
      const dm = (ci >= 0 ? l.slice(0, ci) : l).match(/^#EXTINF:\s*(-?\d+(?:\.\d+)?)/);
      meta = { name: (ci >= 0 ? l.slice(ci + 1).trim() : '') || a('tvg-name'), logo: a('tvg-logo'), cat: a('group-title'), no: parseInt(a('tvg-chno'), 10) || 0, type: a('tvg-type').toLowerCase(), dur: dm ? parseFloat(dm[1]) : -1 };
    } else if (l[0] !== '#' && /^https?:\/\//i.test(l)) {
      const m = meta || { name: '', logo: '', cat: '', no: 0, type: '', dur: -1 };
      const ep = parseEp(m.name);
      let kind = 'live';
      if (m.type === 'series' || ep || /s[eé]rie|series|seriado/i.test(m.cat) && m.dur > 0) kind = 'episode';
      else if (m.type === 'movie' || m.dur > 0 || /movie|film|cinema/i.test(m.cat)) kind = 'movie';
      let name = m.name, series = '', season = 0, epn = 0;
      if (kind === 'episode') {
        series = ep ? ep.series : (m.cat || m.name); season = ep ? ep.season : 1; epn = ep ? ep.ep : 0;
        name = (ep && ep.title) || m.name;
      }
      raw.push([name, l, m.logo, m.cat, m.no, kind, m.dur > 0 ? Math.round(m.dur) : 0, series, season, epn]);
      meta = null;
    }
  }
  return raw;
}
function buildItems(rows) {
  const used = new Set(), ids = new Set(), liveBy = new Map(), out = []; let next = 1;
  rows.forEach((r, i) => {
    const kind = r[5], url = r[1], lk = norm(r[0] || url);
    if (kind === 'live') { const ex = liveBy.get(lk); if (ex) { if (ex.urls.indexOf(url) < 0) ex.urls.push(url); return; } }
    let n = 0;
    if (kind === 'live') { n = r[4]; if (!n || used.has(n)) { while (used.has(next)) next++; n = next; } used.add(n); }
    let id = (kind === 'live' ? 'l' : kind === 'movie' ? 'm' : 'e') + h36(kind === 'live' ? lk : url), k = 1;
    while (ids.has(id)) id = id.replace(/_\d+$/, '') + '_' + (k++);
    ids.add(id);
    const it = {
      id, number: n, name: r[0] || (kind === 'live' ? t('ch') + ' ' + (n || i + 1) : '#' + (i + 1)),
      category: r[3] || (kind === 'live' ? 'Playlist' : kind === 'movie' ? t('movies') : t('series')),
      logo: r[2] || null, status: 'online', kind, dur: r[6], series: r[7], season: r[8], ep: r[9],
      urls: [url], stream: { type: streamType(url), url, alts: [] }, schedule: []

    if (kind === 'live') liveBy.set(lk, it);
    out.push(it);
  });
  out.forEach(it => { it.stream.alts = it.urls.slice(1); });

}
const liveKey = c => 'n:' + (c.addonId ? c.addonId + ':' : '') + norm(c.name);
function applyHealth() {
  ALL.forEach(c => {
    if (c.kind !== 'live' || !c.stream) return;
    if (!c.urls) c.urls = [c.stream.url].concat(c.stream.alts || []);
    const h = HEALTH[liveKey(c)];
    c.dead = !!(h && h[0] === 0);
    const w = (h && h[0] === 1 && h[2] && c.urls.indexOf(h[2]) >= 0) ? h[2] : c.urls[0];
    c.stream.url = w; c.stream.alts = c.urls.filter(u => u !== w);
  });
}
function rebuild() {
  ALL = BASE_ALL.concat(...[...ADDON_CATALOGS.values()]).filter(c => !hidden.has(c.id));
  applyHealth();

  const usedChannelNumbers = new Set();
  let nextChannelNumber = CH.reduce((n, c) => Math.max(n, Number(c.number) || 0), 0) + 1;
  CH.forEach(c => {
    const n = Number(c.number) || 0;
    if (n <= 0 || usedChannelNumbers.has(n)) { while (usedChannelNumbers.has(nextChannelNumber)) nextChannelNumber++; c.number = nextChannelNumber++; }
    usedChannelNumbers.add(Number(c.number));
  });
  CH.sort((a, b) => a.number - b.number);
  MOV = ALL.filter(c => c.kind === 'movie');
  SBY = new Map();
  ALL.filter(c => c.kind === 'episode').forEach(e => {
    const k = norm(e.series); let s = SBY.get(k);
    if (!s) { s = { id: 'sr-' + SBY.size, name: e.series, poster: e.logo, category: e.category, eps: [] }; SBY.set(k, s); }
    if (!s.poster && e.logo) s.poster = e.logo;
    s.eps.push(e);

}

function parseT(s, base) { const p = String(s).split(':').map(Number), d = new Date(base); d.setHours(p[0] || 0, p[1] || 0, 0, 0); return d; }
function timeline(ch, from, n) {
  const sch = ch.schedule || []; if (!sch.length) return [];
  const all = [];
  [-1, 0, 1, 2].forEach(o => { const b = new Date(from); b.setDate(b.getDate() + o); sch.forEach(x => all.push({ start: parseT(x[0], b), title: x[1] })); });
  all.sort((a, b) => a.start - b.start);
  all.forEach((p, i) => { p.end = all[i + 1] ? all[i + 1].start : new Date(p.start.getTime() + 36e5); });
  let i = all.findIndex(p => p.start <= from && from < p.end); if (i < 0) i = 0;
  return all.slice(i, i + n);

function osdToast(txt, ms) { const o = $('#osd'); o.textContent = txt; o.hidden = false; clearTimeout(osdToast.t); osdToast.t = setTimeout(() => { o.hidden = true; }, ms || 1300); }
function setVol(v) { vol = clamp(v, 0, 1); vid.volume = vol; vid.muted = false; if (ytActive) { ytMuted = false; ytCmd('unMute'); ytCmd('setVolume', [Math.round(vol * 100)]); } store.set('vol', vol); osdToast(Math.round(vol * 100) + '%', 1100); syncCtls(); }
function toggleMute() { if (ytActive) { ytMuted = !ytMuted; ytCmd(ytMuted ? 'mute' : 'unMute'); } else vid.muted = !vid.muted; const m = ytActive ? ytMuted : vid.muted; osdToast(m ? t('muted') : Math.round(vol * 100) + '%', 1100); syncCtls(); }
function togglePlay() { if (ytActive) { ytPaused = !ytPaused; ytCmd(ytPaused ? 'pauseVideo' : 'playVideo'); syncCtls(); return; } if (vid.paused) { const p = vid.play(); if (p && p.catch) p.catch(() => {}); } else vid.pause(); }
function seekTo(sec) { if (ytActive) { ytT = sec; ytCmd('seekTo', [sec, true]); onTime(); } else vid.currentTime = sec; }
function seek(delta) { const d = ytActive ? ytD : vid.duration; if (!isVod(cur) || !isFinite(d) || !(d > 0)) return; seekTo(clamp((ytActive ? ytT : vid.currentTime) + delta, 0, d)); osdToast((delta > 0 ? '+' : '−') + Math.abs(delta) + 's', 900); }
function toggleFull() {
  try { if (document.fullscreenElement) document.exitFullscreen(); else if (document.documentElement.requestFullscreen) { const p = document.documentElement.requestFullscreen(); if (p && p.catch) p.catch(() => {}); } } catch (e) {}
}
let digits = '', digitTimer = 0;
function digit(d) {
  digits += d; osdToast(digits, 2000); clearTimeout(digitTimer);
  const commit = () => {
    const n = parseInt(digits, 10); digits = ''; const ch = CH.find(c => c.number === n); $('#osd').hidden = true;
    if (!ch) { toast(t('chNotFound') + ' (' + n + ')'); return; }
    if (playerOpen) tune(ch); else openPlayer(ch);
  };
  if (digits.length >= 3) commit(); else digitTimer = setTimeout(commit, 1700);
}
function doAct(act, el) {
  switch (act) {
    case 'back': if (playerOpen) closePlayer(); break;
    case 'play': togglePlay(); break;
    case 'mute': toggleMute(); break;
    case 'vdown': setVol(vol - 0.1); break;
    case 'vup': setVol(vol + 0.1); break;
    case 'rew': seek(-10); break;
    case 'ffw': seek(10); break;
    case 'full': toggleFull(); break;
    case 'fav': if (cur) toggleFav(cur.id); break;
    case 'remove': if (cur) askRemove(cur.id); break;
    case 'chnext': zap(1); break;
    case 'chprev': zap(-1); break;
    case 'retry': if (cur) tune(cur); break;
    case 'reload': reloadCatalog(); break;
    case 'verify': verifyChannels(); break;
    case 'kodiInstall': {
      const el = $('#kset'); let r = 'error:ponte indisponível';
      try { r = String(RuivoNative.installDemoAddon()); } catch (e) {}
      if (el) el.textContent = r === 'ok' ? t('kodiOk') : r === 'restart' ? t('kodiRestart') : t('kodiFail') + ' (' + r.replace(/^error:/, '') + ')';
      if (r === 'restart') setTimeout(() => { try { RuivoNative.restartApp(); } catch (e) {} }, 1200);
      break;
    }
    case 'kodiLog': {
      try { kodiLogText = kodiLogText ? '' : String(RuivoNative.kodiLogTail()); } catch (e) { kodiLogText = '(ponte indisponível)'; }
      render(); break;
    }
    case 'kodiPlay': {
      let ok = false; try { ok = RuivoNative.playAddon('plugin.video.ruivo.demo', 'action=play&id=bbb'); } catch (e) {}
      const el = $('#kset'); if (!ok && el) el.textContent = t('kodiFail') + ' (' + (S.lang === 'en' ? 'install first' : 'instale primeiro') + ')';
      break;
    }
    case 'plrefresh': refreshPlaylist(false); break;
    case 'plimport': importPlaylist(); break;
    case 'plclear': case 'plremove': removePlaylist(); break;
    case 'restore': restoreHidden(); break;
    case 'about': aboutOpen = !aboutOpen; renderKeep(); break;
    case 'addon-tab': {
      ADDON_TAB = el && el.dataset.tab || 'explore'; ADDON_MESSAGE = ''; renderKeep();
      if (ADDON_TAB === 'explore' && !ADDON_REPO_ITEMS.length && ADDON_REPOS.length) addonBusyCall('repo-sync', {}, at('sync'));
      break;
    }
    case 'addon-install': {
      const input = $('#addonManifestUrl'), url = input ? input.value.trim() : '';
      if (!/^https:\/\//i.test(url)) { toast(t('addonBadUrl')); break; }
      ADDON_PREVIEW = null; addonBusyCall('preview', { url }, at('validate')); break;
    }
    case 'kodi-analyze': {
      const input = $('#kodiPackageUrl'), url = input ? input.value.trim() : '';
      if (!/^https:\/\//i.test(url)) { ADDON_MESSAGE = kt('httpsOnly'); renderKeep(); break; }
      KODI_ANALYSIS = null; addonBusyCall('kodi-analyze', { url }, kt('analyzing')); break;
    }
    case 'addon-confirm': if (ADDON_PREVIEW && ADDON_PREVIEW.previewToken) addonBusyCall('install', { token: ADDON_PREVIEW.previewToken }, at('confirm')); break;
    case 'addon-cancel-preview': ADDON_PREVIEW = null; ADDON_MESSAGE = ''; renderKeep(); break;
    case 'repo-add': {
      const input = $('#repoUrl'), url = input ? input.value.trim() : '';
      if (!/^https:\/\//i.test(url)) { ADDON_MESSAGE = t('addonBadUrl'); renderKeep(); break; }
      addonBusyCall('repo-add', { url }, at('addRepo')); break;
    }
    case 'repo-sync': addonBusyCall('repo-sync', {}, at('sync')); break;
    case 'repo-remove': if (el && el.dataset.url) addonBusyCall('repo-remove', { url: el.dataset.url }, at('removeRepo')); break;
    case 'addon-repo-preview': {
      const item = ADDON_REPO_ITEMS[parseInt(el && el.dataset.index, 10)]; if (!item) break;
      ADDON_TAB = 'install'; ADDON_PREVIEW = null; renderKeep();
      if (item.manifestUrl) addonBusyCall('preview', { url: item.manifestUrl }, at('validate'));
      else if (item.packageUrl) addonBusyCall('package-preview', { url: item.packageUrl, sha256: item.sha256, version: item.version }, at('validate'));
      break;
    }
    case 'addon-check-updates': addonBusyCall('updates', {}, at('checkUpdates')); break;
    case 'addon-demo': addonBusyCall('demo', {}, at('addDemo')); break;
    case 'addon-toggle': {
      const id = el && el.dataset.addonid, enabled = !!(el && el.dataset.enabled !== '1');
      if (!id) break;
      if (!window.__RUIVO_ANDROID__) { toast(t('addonAndroidOnly')); break; }
      const addon = ADDONS.find(a => a.id === id); if (addon) addon.enabled = enabled;
      const q = new URLSearchParams({ requestId: 'addon-' + (++addonReqSeq) + '-' + Date.now(), id, value: enabled ? '1' : '0' });
      window.location.href = 'ruivo-addon://enable?' + q.toString();
      if (!enabled) { ADDON_CATALOGS.delete(id); ADDON_LOADING.delete(id); rebuild(); }
      renderKeep();
      break;
    }
    case 'addon-update': if (el && el.dataset.addonid) addonBusyCall('update', { id: el.dataset.addonid }, at('checkUpdates')); break;
    case 'addon-refresh': if (el && el.dataset.addonid) { ADDON_LOADING.add(el.dataset.addonid); renderKeep(); addonNative('catalog', { id: el.dataset.addonid }); } break;
    case 'addon-remove': if (el && el.dataset.addonid) addonNative('remove', { id: el.dataset.addonid }); break;
    case 'more-live': case 'more-movies': case 'more-series': { const sc = act.slice(5); shown[sc] += 60; renderKeep(); break; }
  }
  if (playerOpen && uiMode === 'controls') setUi('controls');
}

/* ---------- configurações ---------- */
function cycle(key, dir) {
  const def = SETS.find(s => s.k === key); if (!def) return;
  const i = def.opts.indexOf(S[key]); S[key] = def.opts[(i + dir + def.opts.length) % def.opts.length];
  store.set('settings', S);
  if (key === 'theme') applyTheme();
  if (key === 'lang') document.documentElement.lang = S.lang === 'en' ? 'en' : 'pt-BR';
  if (key === 'quality') applyQuality();
  if (key === 'subs') applySubs();
  if (key === 'hideDead') rebuild();
  renderKeep();
}
function applyTheme() { const r = document.documentElement; if (S.theme === 'auto') r.removeAttribute('data-theme'); else r.setAttribute('data-theme', S.theme); }

/* ---------- navegação espacial ---------- */
const visible = el => el.getClientRects().length > 0;
function navigate(dir) {
  const scope = playerOpen ? player : $('#app');
  const els = [...scope.querySelectorAll('[data-f]')].filter(visible), c0 = document.activeElement;
  if (!els.length) return;
  if (!els.includes(c0)) { focusEl(els.find(e => e.closest('#main')) || els[0]); return; }
  const r = c0.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2, horiz = dir === 'Left' || dir === 'Right';
  const pick = strict => {
    let best = null, bs = Infinity;
    for (const el of els) {
      if (el === c0) continue;
      const q = el.getBoundingClientRect(), dx = q.left + q.width / 2 - cx, dy = q.top + q.height / 2 - cy; let prim, sec;
      if (dir === 'Right') { if (dx <= 2) continue; prim = dx; sec = Math.abs(dy); }
      else if (dir === 'Left') { if (dx >= -2) continue; prim = -dx; sec = Math.abs(dy); }
      else if (dir === 'Down') { if (dy <= 2) continue; prim = dy; sec = Math.abs(dx); }
      else { if (dy >= -2) continue; prim = -dy; sec = Math.abs(dx); }
      if (strict && !(horiz ? (q.top < r.bottom && q.bottom > r.top) : (q.left < r.right && q.right > r.left))) continue;
      const s = prim + sec * 3; if (s < bs) { bs = s; best = el; }
    }
    return best;
  };
  const tg = pick(true) || pick(false); if (tg) focusEl(tg);
}

/* ---------- teclado / controle remoto ---------- */
let hold = null, held = false;
const isBack = e => e.key === 'Escape' || e.key === 'Backspace' || e.key === 'BrowserBack' || [4, 10009, 461, 27].includes(e.keyCode);
const isChUp = e => e.key === 'ChannelUp' || e.key === 'PageUp' || e.keyCode === 427;
const isChDown = e => e.key === 'ChannelDown' || e.key === 'PageDown' || e.keyCode === 428;
const isFavKey = e => e.keyCode === 405 || e.key === 'y' || e.key === 'Y' || e.key === 'ContextMenu';
const isEnter = e => e.key === 'Enter' || e.key === ' ' || e.keyCode === 13 || e.keyCode === 23;
const isPlayKey = e => ['MediaPlayPause', 'MediaPlay', 'MediaPause'].includes(e.key) || [415, 19, 179].includes(e.keyCode);
function goBack() {
  if (playerOpen) { closePlayer(); return true; }
  if (view === 'import') { go('settings'); const r = $('[data-view="import"]'); if (r) r.focus({ preventScroll: true }); return true; }
  if (view === 'show') { go('series'); return true; }
  if (view !== 'home') { go('home'); const n = $('.nav.on'); if (n) n.focus({ preventScroll: true }); return true; }
  return false;
}
function favTarget() { const a = document.activeElement; return (a && a.dataset && a.dataset.ch && !playerOpen) ? a : null; }
function activate() {
  const a = document.activeElement;
  if (playerOpen) {
    if (a && player.contains(a) && a.matches('[data-f]') && uiMode !== 'hidden') { a.click(); return; }
    if (uiMode === 'hidden' || !STATE_UI[state]) { showControls(); return; }
  }
  if (a && a.matches && a.matches('[data-f]')) a.click();
}
document.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key, tg0 = e.target;
  if (tg0 && tg0.matches && tg0.matches('input,textarea')) {
    if (isBack(e) && k !== 'Backspace') { e.preventDefault(); goBack(); return; }
    if (k === 'Enter' && tg0.tagName === 'INPUT') { e.preventDefault(); if (tg0.id === 'plUrl') doAct('plimport'); else navigate('Down'); return; }
    const atStart = tg0.selectionStart === 0, atEnd = tg0.selectionEnd === tg0.value.length;
    if (k === 'ArrowUp' && (tg0.tagName === 'INPUT' || atStart)) { e.preventDefault(); navigate('Up'); return; }
    if (k === 'ArrowDown' && (tg0.tagName === 'INPUT' || atEnd)) { e.preventDefault(); navigate('Down'); return; }
    return;
  }
  if (/^[0-9]$/.test(k)) { e.preventDefault(); digit(k); return; }
  if (isChUp(e)) { e.preventDefault(); zap(1); return; }
  if (isChDown(e)) { e.preventDefault(); zap(-1); return; }
  if (isBack(e)) { e.preventDefault(); goBack(); return; }
  if (isFavKey(e)) { e.preventDefault(); if (playerOpen && cur) toggleFav(cur.id); else { const el = favTarget(); if (el) toggleFav(el.dataset.ch); } return; }
  if (k === 'Delete' || e.keyCode === 46 || e.keyCode === 403) { e.preventDefault(); if (playerOpen && cur) askRemove(cur.id); else { const el = favTarget(); if (el) askRemove(el.dataset.ch); } return; }
  if (k === 'MediaStop' || e.keyCode === 413) { if (playerOpen) closePlayer(); return; }
  if (isPlayKey(e)) { if (playerOpen) { e.preventDefault(); togglePlay(); } return; }
  if (k === 'm' || k === 'M') { if (playerOpen) toggleMute(); return; }
  if (k === 'f' || k === 'F') { toggleFull(); return; }
  if (isEnter(e)) {
    e.preventDefault(); if (e.repeat) return;
    held = false; clearTimeout(hold);
    const el = favTarget();
    if (el && (k === 'Enter' || e.keyCode === 13) && !el.dataset.series) hold = setTimeout(() => { held = true; hold = null; toggleFav(el.dataset.ch); }, 650);
    return;
  }
  if (k === 'ArrowLeft' || k === 'ArrowRight' || k === 'ArrowUp' || k === 'ArrowDown') {
    e.preventDefault(); const dir = k.slice(5);
    if (playerOpen) {
      if (uiMode === 'controls' || !(state === 'playing' || state === 'buffering' || state === 'loading')) { navigate(dir); if (uiMode === 'controls') setUi('controls'); return; }
      if (dir === 'Up') zap(1); else if (dir === 'Down') zap(-1);
      else if (isVod(cur)) seek(dir === 'Left' ? -10 : 10);
      else if (dir === 'Left') setVol(vol - 0.05); else setVol(vol + 0.05);
      return;
    }
    const a = document.activeElement;
    if (view === 'settings' && a && a.dataset && a.dataset.set && (dir === 'Left' || dir === 'Right')) { cycle(a.dataset.set, dir === 'Right' ? 1 : -1); return; }
    navigate(dir);
  }
});
document.addEventListener('keyup', e => {
  if (!isEnter(e)) return;
  if (e.target && e.target.matches && e.target.matches('input,textarea')) return;
  e.preventDefault(); clearTimeout(hold); hold = null;
  if (held) { held = false; return; }
  activate();
});

/* mouse / toque */
document.addEventListener('click', e => {
  const tg = e.target; if (!tg || !tg.closest) return;
  if (playerOpen && tg.closest('#pReveal')) { showControls(); return; }
  const del = tg.closest('[data-del]'); if (del) { e.stopPropagation(); askRemove(del.dataset.del, del); return; }
  const star = tg.closest('[data-fav]'); if (star) { e.stopPropagation(); toggleFav(star.dataset.fav); return; }
  const a = tg.closest('[data-act]'); if (a) { doAct(a.dataset.act, a); return; }
  if (playerOpen && tg.closest('#pSeek') && isVod(cur) && isFinite(ytActive ? ytD : vid.duration)) { const r = $('#pSeek').getBoundingClientRect(); seekTo(clamp((e.clientX - r.left) / r.width, 0, 1) * (ytActive ? ytD : vid.duration)); return; }
  const c = tg.closest('[data-ch]'); if (c && !playerOpen) { openPlayer(byId(c.dataset.ch)); return; }
  const sr = tg.closest('[data-series]'); if (sr) { showId = sr.dataset.series; go('show'); const b = $('#heroBtn'); if (b) b.focus({ preventScroll: true }); return; }
  const v = tg.closest('[data-view]'); if (v) { go(v.dataset.view); return; }
  const ct = tg.closest('[data-cat]'); if (ct) { const i = ct.dataset.cat.indexOf('|'); setCat(ct.dataset.cat.slice(0, i), ct.dataset.cat.slice(i + 1)); return; }
  const s = tg.closest('[data-set]'); if (s) { cycle(s.dataset.set, 1); return; }
  if (playerOpen && !tg.closest('[data-f]')) { if (uiMode === 'controls') setUi('hidden'); else showControls(); }
});
document.addEventListener('input', e => {
  if (e.target && e.target.id === 'q') { query = e.target.value; clearTimeout(input_t); input_t = setTimeout(() => { const r = $('#qres'); if (r) r.innerHTML = searchResults(); }, 140); }
  if (e.target && e.target.id === 'addonSearch') { ADDON_QUERY = e.target.value; clearTimeout(input_t); input_t = setTimeout(() => { if (view === 'addons') renderKeep(); }, 180); }
});
document.addEventListener('change', e => {
  if (e.target && e.target.id === 'addonCategory') { ADDON_CATEGORY = e.target.value || 'all'; renderKeep(); }
});
let input_t = 0;
document.addEventListener('mousemove', () => { if (playerOpen && uiMode === 'hidden') setUi('banner'); });
addEventListener('offline', () => { if (playerOpen) { stopStream(); setState('noconn'); } });
addEventListener('online', () => { if (playerOpen && state === 'noconn' && cur) tune(cur); if (!ALL.length) reloadCatalog(); });
setInterval(() => { tickClock(); if (playerOpen && cur && !isVod(cur)) updateInfo(); }, 15000);

/* ponte para botões físicos do app Android */
window.__tv = {
  back() { return goBack(); }, chUp() { zap(1); }, chDown() { zap(-1); },
  fav() { if (playerOpen && cur) toggleFav(cur.id); else { const el = favTarget(); if (el) toggleFav(el.dataset.ch); } },
  remove() { if (playerOpen && cur) askRemove(cur.id); else { const el = favTarget(); if (el) askRemove(el.dataset.ch); } },
  playPause() { if (playerOpen) togglePlay(); }
};

/* ---------- início ---------- */
(async function init() {
  document.documentElement.lang = S.lang === 'en' ? 'en' : 'pt-BR';
  applyTheme(); render();
  await loadCatalog(); render(); window.__booted = true;
  const first = $('#heroBtn') || $('#main [data-f]') || $('.nav.on'); if (first) first.focus({ preventScroll: true });
  if (S.autoUpdate && store.get('plurl', '')) setTimeout(() => refreshPlaylist(true), 1500);
  if (S.autoplay) { const last = byId(store.get('last', '')); if (last) openPlayer(last); }
})();
})();
</script>
